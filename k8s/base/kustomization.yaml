# kubectl apply -k k8s/base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
labels:
  - pairs:
      app.kubernetes.io/name: misogyny-lens
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
# O nome do ConfigMap ganha um hash do conteúdo (lens-config-<hash>). Mudar um valor muda o nome, o
# pod template passa a apontar para o novo e o Deployment faz um rolling update sozinho.
configMapGenerator:
  - name: lens-config
    literals:
      - ENABLE_BERT=1
      - REQUIRE_BERT=1   # sem os pesos do BERT, o pod fica vivo mas fora do Service
      - TORCH_THREADS=2
