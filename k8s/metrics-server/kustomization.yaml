# metrics-server: lê CPU e memória dos kubelets e serve a Metrics API (kubectl top e o HPA usam).
#   kubectl apply -k k8s/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.0/components.yaml
patches:
  # No kind, o certificado do kubelet é autoassinado e não tem o IP do nó: sem esta flag o
  # metrics-server recusa a conexão. Só para o cluster local de estudo.
  - target: {kind: Deployment, name: metrics-server, namespace: kube-system}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
